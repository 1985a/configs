unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1

set -g pane-base-index 1

bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

#bind r source-file ~/.tmux.conf '\'; display "Reloaded!"

unbind p
bind p previous-window

set -sg escape-time 1

set-option -g allow-rename off

#set-hook -g session-created 'run-shell "~/powerline.sh init"' # prettifies the window-status segments


#enable passthrough graphics
set -g default-terminal "tmux-256color"
set -g allow-passthrough on
set -ga terminal-overrides ',xterm-kitty:RGB'
# Para que tmux sepa que el cliente (kitty) soporta truecolor
set -ga terminal-features ',xterm-kitty:RGB'


# (antes "power-daemon", que no existe) y la ruta de python se busca con comodín
run-shell "powerline-daemon -q"
source-file -q "/usr/lib/python3*/site-packages/powerline/bindings/tmux/powerline.conf"

set -g history-limit 50000
set -g display-time 4000
set -g focus-events on

set -g mouse on

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


#set -g utf8
#set-window-option -g utf8 on
#set -g status-utf8 on
#set -g utf8 on

# Mantiene el dbus correcto para el usuario

# uid del usuario actual en lugar de 1000 fijo
run-shell 'tmux set-environment -g XDG_RUNTIME_DIR "/run/user/$(id -u)"; tmux set-environment -g DBUS_SESSION_BUS_ADDRESS "unix:path=/run/user/$(id -u)/bus"'

set-option -g update-environment "DISPLAY WAYLAND_DISPLAY SWAYSOCK XDG_SESSION_TYPE XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR SSH_AUTH_SOCK"
